name: Atualizar tabela SIGTAP

# Baixa a tabela oficial do DATASUS, gera os arquivos de dados do app e
# grava na mesma branch. Rode em Actions › Atualizar tabela SIGTAP › Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar e converter
        run: python3 scripts/atualizar_tabelas.py

      - name: Gravar na branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/GeradorDocumentos/SIGTAPDados.swift
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -m "Atualiza tabela SIGTAP"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          # Um push feito por esta rotina não dispara a compilação sozinho.
          gh workflow run build.yml --ref "${GITHUB_REF_NAME}"
